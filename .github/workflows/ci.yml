name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt && python -m pip install -e .
      - name: Compile source
        run: python -m compileall -q src api train.py
      - name: Run tests
        run: python -m pytest tests/ -v
      - name: Lint
        run: python -m ruff check src api tests train.py
